<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box-Model</title>

    <style>
        .section-one {
            width: 200px;
            height: 150px;
            border: 5px solid black ;
            padding: 15px;
            margin: 20px;
            background-color: deeppink;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuzeDUP-ufUmV_8exqtXLB1JGXwL4WJeSVwryAWEGBAQ&s=10);
            background-position: top center;
            background-size: cover;
            color: white;
            border-width: 10px;
            border-right-color: green ;
            border-left-color: blue ;
            border-top-color: yellow ;
            border-bottom-color: firebrick ;
        }
    
        .section-two {
            background-color: cyan;
            width: 200px;
            height: 150px;
            border: 5px solid black ;
            padding: 15px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <section class="section-one"><p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam ipsa soluta aut eos? Quae repellat natus delectus voluptas aliquid reprehenderit enim consectetur vel consequatur incidunt quod nulla, vero pariatur accusamus.</p></section>
    <section class="section-two">2</section>
</body>
</html>
