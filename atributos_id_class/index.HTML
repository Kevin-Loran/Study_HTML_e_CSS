<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo sobre atributos(id_class)</title>
    <style>
        h1 {
            background-color: red;
        }

        h2{
            background-color: blue;
        }

        .titulo_cor_vermelha  {
            color: rgb(132, 8, 8)
        }

        #titulo-h2 {
            color: pink
        }
    </style>
</head>
<body>
    <h1 id="titulo-h1" class="titulo_cor_vermelha">Titulo</h1>
    <h2 id="titulo-h2" class="titulo_cor_azul">sub-titulo</h2>
</body>
</html>
