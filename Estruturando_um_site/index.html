<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estruturando um site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxYoyaSHCgR-doBZWcL2r6hAD-yjbeUnqxIXf4wOOJ0A&s=10);
            background-position: top center ;
            background-size: cover;
        }

        #heading div {
            width: 90%;
            display: flex;
            justify-content: space-between;
            margin: 0 auto;
        }


        #heading {
            background: rgba(0, 0, 0, 0.5);
        }

         #heading .h1 {
            padding: 15px;
            font-size: 20px;
            text-transform: uppercase;    
        }

         #heading a {
            color: white;
            text-decoration: none;
            font-family: sans-serif;
         }

    </style>
</head>
<body>
    <header id="heading">
        <div>
        <h1 class="h1">
            <a href="">Netflix</a>
        </h1>

        <h1 class="h1">
            <a href="">Netflix</a>
        </h1>
        </div>
        
    </header>
</body>
</html>
